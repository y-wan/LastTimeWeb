<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D65A3A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-20260919.png" />
    <title>Last Time</title>
    <meta name="apple-mobile-web-app-title" content="Last Time" />
    <script>
      (() => {
        const localeKey = 'last-time-app-locale'
        const primaryLanguage = navigator.languages?.[0] || navigator.language || 'en'
        let persistedLocale
        try {
          persistedLocale = localStorage.getItem(localeKey)
        } catch (error) {
          console.warn('Unable to read the persisted app language.', error)
        }
        const locale = persistedLocale === 'zh-CN' || persistedLocale === 'en'
          ? persistedLocale
          : primaryLanguage.toLowerCase().startsWith('zh') ? 'zh-CN' : 'en'
        const isChinese = locale === 'zh-CN'
        const name = isChinese ? '上次' : 'Last Time'
        document.documentElement.lang = locale
        document.title = name
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = name
        const manifest = document.createElement('link')
        manifest.rel = 'manifest'
        manifest.href = isChinese ? './manifest.zh-CN.webmanifest' : './manifest.en.webmanifest'
        document.head.appendChild(manifest)
        try {
          localStorage.setItem(localeKey, locale)
        } catch (error) {
          console.warn('Unable to persist the app language for install metadata.', error)
        }
      })()
    </script>
    <link rel="icon" href="./app-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
