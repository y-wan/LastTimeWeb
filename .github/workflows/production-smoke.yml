name: Production smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: version
        name: Read package version
        run: node -e "console.log('value=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Verify deployed commit
        env:
          PRODUCTION_URL: https://lasttime.feliciameow.com
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-smoke.mjs --url="$PRODUCTION_URL" --version="$EXPECTED_VERSION" --sha="$EXPECTED_SHA"
