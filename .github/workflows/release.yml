name: Release

on:
  workflow_run:
    workflows: ["Azure Static Web Apps deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      target_sha: ${{ steps.release.outputs.target_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Detect unpublished version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          version="${REQUESTED_VERSION:-$package_version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the form X.Y.Z." >&2
            exit 1
          fi
          test "$version" = "$package_version"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"

          if git rev-parse --verify --quiet "refs/tags/v$version"; then
            if [[ "$EVENT_NAME" = "workflow_dispatch" ]]; then
              echo "Version v$version has already been released." >&2
              exit 1
            fi
            echo "Version v$version already exists; no release is needed."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate release target
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          ! git rev-parse --verify --quiet "refs/tags/v$VERSION"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run lighthouse
      - name: Verify production target
        env:
          PRODUCTION_URL: https://lasttime.feliciameow.com
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: node scripts/production-smoke.mjs --url="$PRODUCTION_URL" --version="$VERSION" --sha="$EXPECTED_SHA"

  publish:
    name: Publish release
    needs: [prepare, validate]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the form X.Y.Z." >&2
            exit 1
          fi
          tag_sha="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="v$VERSION" \
              -f message="Last Time Web v$VERSION" \
              -f object="$TARGET_SHA" \
              -f type=commit \
              --jq .sha
          )"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$tag_sha"
          generated_notes="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" \
              -f target_commitish="$TARGET_SHA" \
              --jq .body
          )"
          {
            echo "Official PWA: https://lasttime.feliciameow.com"
            echo
            curated_notes=".github/release-notes/$VERSION.md"
            if [[ -f "$curated_notes" ]]; then
              cat "$curated_notes"
              echo
            fi
            printf '%s\n' "$generated_notes"
          } > release-notes.md
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Last Time Web v$VERSION" \
            --notes-file release-notes.md \
            --latest
