name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate release target
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the form X.Y.Z." >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/heads/main"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          ! git rev-parse --verify --quiet "refs/tags/v$VERSION"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run lighthouse
      - name: Verify production target
        env:
          PRODUCTION_URL: https://lasttime.feliciameow.com
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-smoke.mjs --url="$PRODUCTION_URL" --version="$VERSION" --sha="$EXPECTED_SHA"

  publish:
    name: Publish release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the form X.Y.Z." >&2
            exit 1
          fi
          tag_sha="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="v$VERSION" \
              -f message="Last Time Web v$VERSION" \
              -f object="$TARGET_SHA" \
              -f type=commit \
              --jq .sha
          )"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$tag_sha"
          generated_notes="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" \
              -f target_commitish="$TARGET_SHA" \
              --jq .body
          )"
          {
            echo "Official PWA: https://lasttime.feliciameow.com"
            echo
            if [[ "$VERSION" = "1.0.3" ]]; then
              echo "## Highlights"
              echo
              echo "- Moves the official application entry point to Azure Static Web Apps."
              echo "- Starts OneDrive synchronization shortly after recording an occurrence instead of waiting for the undo window."
              echo "- Keeps undo reliable by synchronizing the compensating deletion when used."
              echo "- Retains the previous Cloudflare deployment temporarily as a rollback target."
              echo
              echo "No local data migration or OneDrive file-format change is required."
              echo
            fi
            printf '%s\n' "$generated_notes"
          } > release-notes.md
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Last Time Web v$VERSION" \
            --notes-file release-notes.md \
            --latest
