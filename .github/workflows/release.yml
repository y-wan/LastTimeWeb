name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate release target
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          ! git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run lighthouse
      - name: Verify production target
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/production-smoke.mjs --version=$VERSION --sha=${{ github.sha }}
      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Last Time Web v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "Last Time Web v$VERSION" --generate-notes --latest
